type Mutation {
  onGitUpdate: STDResult
    @execute(
      windows: ["scripts\\setup-windows.bat"],
      linux: ["./scripts/setup.sh"],
      macos: ["./scripts/setup.sh"]
    )

  """
  Uspoređuje cijene guma na internetu prema dimenzijama i sezonalnosti.
  Dimenzije se unose u standardnom formatu (npr. 205/55R16).
  """
  compareTirePrices(
    width: Int = 205
    @label(value: "Širina (mm)")

    profile: Int = 55
    @label(value: "Profil (%)")

    rim: Int = 16
    @label(value: "Felga (inch)")

    season: String = "summer"
    @label(value: "Sezona (summer / winter / allseason)")

    maxResults: Int = 10
    @label(value: "Maks. rezultata po sajtu")
  ): STDResult
  @robot(
    euuid: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
    name: "Usporedba cijena guma"
    task_message: "Tražim {{width}}/{{profile}}R{{rim}} ({{season}}) gume..."
  )
  @form_input
  @execute(commands: [
    "node robots/tire_comparator.mjs"
  ])

  """
  Dohvaća vremensku prognozu za zadani grad koristeći Open-Meteo API.
  Prikazuje dnevne temperature, padaline i opis vremena.
  """
  weatherForecast(
    city: String = "Zagreb"
    @label(value: "Grad")

    days: Int = 7
    @label(value: "Broj dana (1-16)")

    units: String = "celsius"
    @label(value: "Jedinice (celsius / fahrenheit)")
  ): STDResult
  @robot(
    euuid: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
    name: "Vremenska prognoza"
    task_message: "Dohvaćam prognozu za {{city}} ({{days}} dana)..."
  )
  @form_input
  @execute(commands: [
    "node robots/weather_forecast.mjs"
  ])

  """
  Izračunava cijenu slanja pošiljke putem web sučelja Hrvatske pošte.
  Otvara browser, odabire vrstu pošiljke, težinu i klikće Izračunaj.
  """
  postaKalkulator(
    promet: String = "unutarnji"
    @label(value: "Promet (unutarnji / medjunarodni)")

    vrstaPosiljke: String = "pismo"
    @label(value: "Vrsta (pismo / paket / paket24 / paket24box / dopisnica / prioritetno / preporucena / vrijednosno / tiskanica)")

    tezina: String = "do 50"
    @label(value: "Težina - odaberi iz liste (npr. 'do 50', '51-100', '0 - 1 kg'...)")

    odrediste: String = ""
    @label(value: "Odredište za međunarodni promet (npr. NJEMAČKA)")

    preuzimanje: String = ""
    @label(value: "Preuzimanje za paket (npr. 'u poštanskom uredu' ili 'na adresi')")
  ): STDResult
  @robot(
    euuid: "d4e5f6a7-b8c9-0123-defa-234567890123"
    name: "HP Kalkulator cijene slanja"
    task_message: "Izračunavam cijenu: {{vrstaPosiljke}} ({{promet}}, {{tezina}})..."
  )
  @form_input
  @execute(commands: [
    "node robots/posta_kalkulator.mjs"
  ])

  """
  Dohvaća trenutne cijene kriptovaluta s CoinGecko API-ja.
  Prikazuje cijenu, 24h promjenu i market cap.
  """
  cryptoPrices(
    coins: String = "bitcoin,ethereum,solana"
    @label(value: "Kriptovalute (odvojene zarezom)")

    currency: String = "eur"
    @label(value: "Valuta (eur / usd / gbp)")
  ): STDResult
  @robot(
    euuid: "c3d4e5f6-a7b8-9012-cdef-123456789012"
    name: "Cijene kriptovaluta"
    task_message: "Dohvaćam cijene: {{coins}} u {{currency}}..."
  )
  @form_input
  @execute(commands: [
    "node robots/crypto_prices.mjs"
  ])
}
